<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>火柴人格斗 - 纯前端 MVP</title>
  <link rel="stylesheet" href="src/styles/main.css" />
</head>
<body>
  <div id="app" class="app">
    <section id="screen-start" class="screen active">
      <div class="card">
        <h1>火柴人格斗</h1>
        <p>纯前端 2D 横版平台格斗小游戏</p>
        <div class="button-group">
          <button id="btn-start-battle" class="btn primary">开始游戏</button>
          <button id="btn-open-settings" class="btn">角色选择 / 外观设置</button>
        </div>
        <p class="tip">键盘：WASD / 方向键移动，J攻击，K跳跃，Enter开始。建议 iPad 横屏体验。</p>
      </div>
    </section>

    <section id="screen-settings" class="screen">
      <div class="card settings-card">
        <h2>角色设置</h2>
        <div class="grid-2">
          <fieldset>
            <legend>玩家1</legend>
            <label>颜色 <input id="p1-color" type="color" value="#22c55e" /></label>
            <label>武器
              <select id="p1-weapon">
                <option value="fist">拳套</option>
                <option value="sword">短剑</option>
                <option value="staff">短棍</option>
              </select>
            </label>
            <label>血量 <input id="p1-hp" type="range" min="60" max="180" value="120" /><span id="p1-hp-v">120</span></label>
            <label>攻击力 <input id="p1-atk" type="range" min="5" max="30" value="12" /><span id="p1-atk-v">12</span></label>
            <label>速度 <input id="p1-speed" type="range" min="3" max="8" step="0.2" value="5" /><span id="p1-speed-v">5</span></label>
          </fieldset>
          <fieldset>
            <legend>AI 敌人</legend>
            <label>颜色 <input id="ai-color" type="color" value="#ef4444" /></label>
            <label>武器
              <select id="ai-weapon">
                <option value="fist">拳套</option>
                <option value="sword">短剑</option>
                <option value="staff">短棍</option>
              </select>
            </label>
            <label>血量 <input id="ai-hp" type="range" min="60" max="200" value="120" /><span id="ai-hp-v">120</span></label>
            <label>攻击力 <input id="ai-atk" type="range" min="5" max="30" value="10" /><span id="ai-atk-v">10</span></label>
            <label>速度 <input id="ai-speed" type="range" min="3" max="8" step="0.2" value="4.6" /><span id="ai-speed-v">4.6</span></label>
            <label>难度 <input id="ai-difficulty" type="range" min="1" max="5" step="1" value="2" /><span id="ai-difficulty-v">2</span></label>
          </fieldset>
        </div>
        <div class="button-group">
          <button id="btn-begin" class="btn primary">开始对战</button>
          <button id="btn-back-home" class="btn">返回首页</button>
        </div>
      </div>
    </section>

    <section id="screen-game" class="screen game-screen">
      <div class="hud">
        <div class="hp-wrap">
          <div>玩家</div>
          <div class="hp-bar"><div id="hp-player" class="hp-fill player"></div></div>
        </div>
        <div class="status" id="game-status">战斗中</div>
        <div class="hp-wrap">
          <div>AI</div>
          <div class="hp-bar"><div id="hp-ai" class="hp-fill ai"></div></div>
        </div>
      </div>
      <canvas id="game-canvas" width="1280" height="720" aria-label="火柴人格斗画布"></canvas>
      <div class="mobile-controls" id="mobile-controls">
        <div class="joystick" id="joystick-base"><div id="joystick-stick" class="stick"></div></div>
        <div class="action-buttons">
          <button id="btn-jump" class="round-btn">跳</button>
          <button id="btn-attack" class="round-btn attack">攻</button>
        </div>
      </div>
    </section>

    <section id="screen-result" class="screen">
      <div class="card">
        <h2 id="result-title">胜利！</h2>
        <p id="result-desc">你击败了敌人</p>
        <div class="button-group">
          <button id="btn-restart" class="btn primary">再来一局</button>
          <button id="btn-home" class="btn">返回首页</button>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="src/js/main.js"></script>
</body>
</html>
